# Chasse Studio Desktop — bundled defaults.
# User-editable overrides live in ~/.chasse-studio/app.properties (they win
# over this file; CLI flags --app-url / --port win over both).

# Hosted web app to load in the webview.
app.url=https://studio-chasse.vercel.app/

# LAN sync server port (phone remote).
server.port=8765

# LAN addresses starting with this prefix win the automatic interface choice
# (e.g. campus networks). Keep RFC1918 addresses only either way.
network.preferred-prefix=10.161.79.

# Title of the bundled phone remote page.
remote.page-title=Chass\u00e9 Studio \u2014 Remote
